server {
    listen 80;
    server_name chat-manage.sharex.team;
    location /.well-known/acme-challenge/ { root /var/www/wechat-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name chat-manage.sharex.team;
    ssl_certificate /etc/letsencrypt/live/chat-manage.sharex.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-manage.sharex.team/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    auth_basic "WeChat management";
    auth_basic_user_file /etc/nginx/wechat-manage.htpasswd;
    include /etc/nginx/wechat-desktop-locations.conf;
    location / {
        proxy_pass http://127.0.0.1:18788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
}
