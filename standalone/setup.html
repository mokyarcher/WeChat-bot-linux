<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微信机器人 · 独立运行</title>
<style>
body{font:16px system-ui;background:#f4f6f8;color:#1c2732;max-width:680px;margin:50px auto;padding:0 20px}
main{background:white;padding:28px;border-radius:14px}label{display:block;margin:18px 0}
input,select{display:block;box-sizing:border-box;width:100%;padding:11px;margin-top:7px;border:1px solid #ccd4dd;border-radius:6px;background:white;font:inherit}
input:read-only{background:#f4f6f8;color:#526070}button,a{margin:8px 10px 8px 0}
button{padding:10px 18px;cursor:pointer}button:disabled{cursor:wait;opacity:.6}
pre{white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;color:#526070}small{display:block;color:#526070;line-height:1.7;margin:8px 0}
</style>
<main>
  <h1>微信机器人</h1><p id="monitored-room">测试群：加载中…</p>
  <p><a href="/desktop/" target="_blank" rel="noopener">打开远程微信桌面</a> <small>需手机动态验证码和独立桌面密码，无需 SSH 隧道。手动操作微信前请先暂停回复。</small></p>
  <form id="modelForm">
    <label>模型预设<select id="preset" disabled aria-describedby="presetNote"><option>加载中…</option></select></label>
    <small id="presetNote"></small><a id="providerDocs" target="_blank" rel="noopener noreferrer" hidden>平台接入说明</a>
    <label>API Key<input id="apiKey" type="password" autocomplete="off"></label>
    <small id="keyHint"></small>
    <details id="advanced"><summary>查看接口地址与模型名</summary>
      <label>接口地址<input id="baseUrl" type="url" required placeholder="https://api.example.com/v1"></label>
      <label>模型名<input id="model" required></label>
    </details>
    <button id="save" disabled>保存配置</button>
  </form>
  <button id="test">测试已保存的模型</button><button id="enable">启用测试群回复</button><button id="pause">暂停回复</button>
  <p><a href="/wechat-bot">查看原版人设、记忆和诊断面板</a></p><pre id="status" role="status" aria-live="polite"></pre>
</main>
<script>
const byId = id => document.getElementById(id);
const statusBox = byId('status');
const presetSelect = byId('preset');
const baseUrl = byId('baseUrl');
const model = byId('model');
const apiKey = byId('apiKey');
let presets = [];
let saved = {};

async function api(path, body) {
  const response = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST', headers: { 'content-type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) throw Error(data.error || '操作失败');
  return data;
}

async function show(action) {
  try { await action(); } catch (error) { statusBox.textContent = error.message; }
}

function refreshKeyHint() {
  const reusable = saved.hasKey && saved.baseUrl === baseUrl.value.replace(/\/$/, '');
  apiKey.placeholder = reusable ? '已保存，可留空继续使用' : '填写所选平台的 API Key';
  apiKey.required = !reusable;
  byId('keyHint').textContent = reusable ? '留空会保留该平台已保存的密钥。' : '请填写所选平台的密钥。';
}

function selectPreset() {
  const preset = presets.find(item => item.id === presetSelect.value);
  apiKey.value = '';
  baseUrl.readOnly = !!preset;
  model.readOnly = !!preset;
  byId('advanced').open = !preset;
  if (preset) { baseUrl.value = preset.baseUrl; model.value = preset.model; }
  byId('presetNote').textContent = preset?.note || '填写兼容 Chat Completions 的接口地址和模型名。';
  byId('providerDocs').hidden = !preset;
  if (preset) byId('providerDocs').href = preset.docs;
  refreshKeyHint();
}

async function loadSettings() {
  const state = await api('/runtime/status');
  saved = state.model;
  baseUrl.value = saved.baseUrl;
  model.value = saved.model;
  presetSelect.value = saved.model ? saved.presetId : 'deepseek-flash';
  selectPreset();
  statusBox.textContent = state.bridge.polling ? '测试群自动回复已启用。' : '测试群自动回复已暂停。';
}

presetSelect.onchange = selectPreset;
baseUrl.oninput = refreshKeyHint;
byId('modelForm').onsubmit = event => {
  event.preventDefault();
  show(async () => {
    await api('/runtime/model', { presetId: presetSelect.value, baseUrl: baseUrl.value, model: model.value, apiKey: apiKey.value });
    apiKey.value = '';
    await loadSettings();
    statusBox.textContent = '配置已保存，可以测试模型连接。';
  });
};
byId('test').onclick = () => show(async () => {
  byId('test').disabled = true;
  statusBox.textContent = '正在测试已保存的模型…';
  try { const result = await api('/runtime/model/test', {}); statusBox.textContent = '连接成功：' + result.text; }
  finally { byId('test').disabled = false; }
});
byId('enable').onclick = () => show(async () => {
  statusBox.textContent = '正在同步测试群，随后开始处理新消息…';
  await api('/runtime/enable', { enabled: true }); statusBox.textContent = '测试群自动回复已启用。';
});
byId('pause').onclick = () => show(async () => {
  await api('/runtime/enable', { enabled: false }); statusBox.textContent = '测试群自动回复已暂停。';
});
show(async () => {
  const binding = await api('/runtime/room');
  byId('monitored-room').textContent = '测试群：' + binding.name;
  presets = (await api('/runtime/presets')).presets;
  presetSelect.replaceChildren();
  for (const item of [...presets, { id: 'custom', label: '自定义兼容接口' }]) {
    const option = document.createElement('option'); option.value = item.id; option.textContent = item.label;
    presetSelect.append(option);
  }
  await loadSettings();
  presetSelect.disabled = false;
  byId('save').disabled = false;
});
</script>
</html>
