# Include inside the existing HTTPS server. Backend ports remain loopback-only.
location = /auth { auth_basic off; return 302 /auth/; }
location /auth/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:19091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    add_header Cache-Control "no-store" always;
}
location = /internal/desktop-auth {
    internal;
    auth_basic off;
    proxy_pass http://127.0.0.1:19091/api/authz/auth-request;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
}
location = /desktop { auth_basic off; return 302 /desktop/; }
location @desktop_login {
    auth_basic off;
    return 302 https://chat-manage.sharex.team/auth/?rd=https://chat-manage.sharex.team/desktop/;
}
location = /desktop/ {
    auth_basic off;
    return 302 /desktop/vnc.html?autoconnect=1&resize=scale&path=desktop/websockify;
}
location /desktop/ {
    auth_basic off;
    if ($http_origin !~ "^(https://chat-manage\.sharex\.team)?$") { return 403; }
    auth_request /internal/desktop-auth;
    error_page 401 = @desktop_login;
    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin https://$host;
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options SAMEORIGIN always;
}
